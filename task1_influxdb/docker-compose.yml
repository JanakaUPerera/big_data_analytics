services:

  influxdb:
    image: influxdb:2.7
    container_name: task1-influxdb

    ports:
      - "8086:8086"

    volumes:
      - ./influxdb-data:/var/lib/influxdb2

    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_INIT_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_INIT_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_INIT_ADMIN_TOKEN}

    healthcheck:
      test: ["CMD", "curl", "-f", "${INFLUX_BROWSER_URL:-http://localhost:8086}/health"]
      interval: 10s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  python:
    image: python:3.12-slim
    container_name: task1-python
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      INFLUX_URL: ${INFLUX_URL}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      INFLUX_TOKEN: ${INFLUX_TOKEN}
    depends_on:
      influxdb:
        condition: service_healthy
    command: sh -c "pip install --disable-pip-version-check -q -r requirements.txt && tail -f /dev/null"
    restart: unless-stopped